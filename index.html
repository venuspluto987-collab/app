<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Art Box 🎨</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; max-width: 500px; width: 100%; margin-top: 20px; }
        input { width: 85%; padding: 15px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus { border-color: #ff4b4b; }
        button { background: #ff4b4b; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #output { margin-top: 30px; min-height: 100px; }
        img { max-width: 100%; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border: 4px solid white; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ff4b4b; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <h1>My Magic Art Box 🎨</h1>
        <p>What should the artist draw for you?</p>
        
        <input type="text" id="prompt" placeholder="A fire lion in the jungle...">
        <br>
        <button id="btn" onclick="makeMagic()">Make Magic! ✨</button>

        <div id="output">
            </div>
    </div>

    <script>
        function makeMagic() {
            const promptInput = document.getElementById('prompt');
            const output = document.getElementById('output');
            const btn = document.getElementById('btn');
            
            const prompt = promptInput.value.trim();

            if (!prompt) {
                alert("Please type an idea first!");
                return;
            }

            // 1. Show Loading State
            btn.disabled = true;
            btn.innerText = "Drawing (Please wait 10s)...";
            output.innerHTML = `
                <div class="spinner"></div>
                <p>The artist is thinking about <b>${prompt}</b>...</p>
            `;

            // 2. Generate a random seed to avoid getting the same image
            const seed = Math.floor(Math.random() * 1000000);
            
            // 3. Create the Image URL
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=1024&nologo=true`;

            // 4. Create an image object to test if it loads
            const img = new Image();
            img.src = imageUrl;

            img.onload = function() {
                output.innerHTML = `
                    <h3 style="color:#ff4b4b;">Ta-da! Masterpiece Ready! ✨</h3>
                    <img src="${imageUrl}" alt="AI Generated Art">
                    <p style="font-size: 12px; color: #888; margin-top: 10px;">Right-click the image to save it!</p>
                `;
                btn.disabled = false;
                btn.innerText = "Make Magic! ✨";
            };

            img.onerror = function() {
                output.innerHTML = `
                    <p style="color:red;">The artist is a bit sleepy. 😴</p>
                    <button onclick="makeMagic()" style="background:#666; width:auto;">Try Again</button>
                `;
                btn.disabled = false;
                btn.innerText = "Make Magic! ✨";
            };
        }
    </script>
</body>
</html>
