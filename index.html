
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Art Box 🎨</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f6; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; max-width: 500px; width: 100%; margin-top: 20px; }
        input { width: 85%; padding: 15px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 15px; font-size: 16px; }
        button { background: #ff4b4b; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; }
        button:disabled { background: #ccc; }
        #output { margin-top: 30px; }
        img { max-width: 100%; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ff4b4b; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <h1>My Magic Art Box 🎨</h1>
        <p>Type an idea and click magic!</p>
        
        <input type="text" id="prompt" placeholder="A lion made of fire...">
        <br>
        <button id="btn" onclick="makeMagic()">Make Magic! ✨</button>

        <div id="output"></div>
    </div>

    <script>
        function makeMagic() {
            const prompt = document.getElementById('prompt').value;
            const output = document.getElementById('output');
            const btn = document.getElementById('btn');

            if (!prompt) {
                alert("Please type an idea!");
                return;
            }

            // Start Loading
            btn.disabled = true;
            btn.innerText = "Drawing...";
            output.innerHTML = `<div class="spinner"></div><p>The artist is drawing: <b>${prompt}</b>...</p>`;

            const seed = Math.floor(Math.random() * 99999);
            // We use pollinations.ai - it's a free artist!
            const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}`;

            const img = new Image();
            img.src = imageUrl;
            
            img.onload = function() {
                output.innerHTML = `<h3>Masterpiece! ✨</h3><img src="${imageUrl}">`;
                btn.disabled = false;
                btn.innerText = "Make Magic! ✨";
            };
            
            img.onerror = function() {
                output.innerHTML = "<p>The artist is busy. Try again!</p>";
                btn.disabled = false;
                btn.innerText = "Make Magic! ✨";
            };
        }
    </script>
</body>
</html>
